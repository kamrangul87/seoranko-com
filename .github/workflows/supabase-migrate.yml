name: Supabase migrations

# Apply supabase/migrations to hosted Postgres on every push to main.
# Prevents the recurring failure mode where migration files merge but are
# never applied (Index Diagnosis / Link Graph / Fix Agent tables, etc.).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: supabase-migrate-main
  cancel-in-progress: false

jobs:
  db-push:
    name: supabase db push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply pending migrations to hosted Supabase
        env:
          # Minimum: SUPABASE_DB_PASSWORD. Project ref defaults in the script.
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          chmod +x scripts/ci-supabase-db-push.sh
          ./scripts/ci-supabase-db-push.sh
