name: Supabase migrations

# Apply supabase/migrations to hosted Postgres on every push to main.
# Prevents the recurring failure mode where migration files merge but are
# never applied (Index Diagnosis / Link Graph / Fix Agent tables, etc.).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: supabase-migrate-main
  cancel-in-progress: false

jobs:
  db-push:
    name: supabase db push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply pending migrations to hosted Supabase
        env:
          # Minimum: SUPABASE_DB_PASSWORD. Project ref + IPv4 pooler default in the script.
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_POOLER_HOST: ${{ secrets.SUPABASE_POOLER_HOST }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          chmod +x scripts/ci-supabase-db-push.sh
          ./scripts/ci-supabase-db-push.sh

      - name: Intervention dataset prod status (read-only)
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_POOLER_HOST: ${{ secrets.SUPABASE_POOLER_HOST }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PROBE_WRITE: 'false'
        run: |
          npm install --no-save pg@8.16.3
          node scripts/intervention-pr2-prod-status.mjs

      - name: Autodun Fix Agent → intervention → causal e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_CONNECTION_ENCRYPTION_KEY: ${{ secrets.SITE_CONNECTION_ENCRYPTION_KEY }}
          GOOGLE_GSC_CLIENT_ID: ${{ secrets.GOOGLE_GSC_CLIENT_ID }}
          GOOGLE_GSC_CLIENT_SECRET: ${{ secrets.GOOGLE_GSC_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_POOLER_HOST: ${{ secrets.SUPABASE_POOLER_HOST }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # Need full install so tsx can resolve @/ imports in analyze/fix-agent.
          npm ci
          npm install --no-save pg@8.16.3
          # Fix Agent path needs service-role + encryption (often unset in Actions).
          if [ -n "${NEXT_PUBLIC_SUPABASE_URL}" ] && [ -n "${SUPABASE_SERVICE_ROLE_KEY}" ] && [ -n "${SITE_CONNECTION_ENCRYPTION_KEY}" ]; then
            npx --yes tsx scripts/run-autodun-intervention-e2e.ts
          else
            echo "::warning::Skipping Fix Agent e2e — missing Supabase/encryption secrets; completing causal loop via Postgres"
          fi
          # Postgres-only: prereg + link intervention + analyze → causal_results.
          # Works with SUPABASE_DB_PASSWORD already present for migrate.
          npx --yes tsx scripts/complete-causal-loop.ts
          node scripts/intervention-pr2-prod-status.mjs
          # Phase 2A Step 1: live GSC token probe (fails loud if secrets missing).
          node scripts/gsc-phase2a-token-probe.mjs || echo "::warning::Phase 2A token probe exited non-zero — check secrets"
          # Phase 2A H3 root-cause: per-source queue predicates vs prod row counts (read-only).
          node scripts/gsc-inspection-queue-sources-probe.mjs || echo "::warning::inspection queue sources probe exited non-zero"
          # Phase 2A: attempt one real GSC URL Inspection (never fabricates).
          node scripts/gsc-first-inspection-probe.mjs || echo "::warning::GSC first-inspection probe exited non-zero"
          # Phase 2B evidence: verified Fix Agent kinds in prod (read-only).
          node scripts/fix-agent-verified-kinds-probe.mjs || echo "::warning::verified-kinds probe exited non-zero"
          # Phase 4: platform usage vs quotas + first-beta candidate inventory.
          node scripts/beta-platform-usage-probe.mjs || echo "::warning::platform-usage probe exited non-zero"
          node scripts/beta-candidates-probe.mjs || echo "::warning::beta-candidates probe exited non-zero"
