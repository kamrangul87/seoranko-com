name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unique migration timestamps
        run: bash scripts/check-unique-migration-timestamps.sh
      - name: Migration CREATE TABLE requires RLS + service_role grants
        run: |
          npm run check:migration-grants -- --self-test
          npm run check:migration-grants
      - name: expected.json requires seoranko-fixture seed commit link
        run: bash scripts/check-expected-json-seed-link.sh
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
      - name: Lint
        run: npm run lint
      - name: Supabase clients must use no-store fetch
        run: npm run check:supabase-no-store
      - name: Typecheck (production sources, mirrors next build)
        run: npm run typecheck
      - name: Production build
        run: npm run build
        env:
          # Build-time public stubs — no secrets; mirrors Vercel compile check.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: public-anon-key-for-ci-build
      - name: Permanent audit-site fixture suite
        run: npm run test:fixtures
      - name: Index Diagnosis / Sitemap / Link Graph / Fix Agent / beta regressions
        run: >
          npm test -- --run
          src/lib/__fixtures__/audit-sites/
          src/lib/index-diagnosis/
          src/lib/sitemap-generator/
          src/lib/link-graph/
          src/lib/audit-persist-migration-ci.contract.test.ts
          src/lib/audit-saved-stale-link-graph.test.ts
          src/lib/finding-status.test.ts
          src/lib/fix-agent-live-verify.test.ts
          src/lib/fix-agent-strategy-contract.test.ts
          src/lib/fix-agent-summary.test.ts
          src/lib/domain-period-regex.regression.test.ts
          src/lib/sentence-boundaries.test.ts
          src/lib/site-connection-lookup.test.ts
          src/lib/regression-fixtures-ci.contract.test.ts
          src/lib/public-index-diagnosis/
          src/lib/gsc/pr1-wiring.test.ts
          src/lib/gsc/index-insights.test.ts
          src/lib/gsc/baseline-readiness.test.ts
          src/lib/gsc/dedupe-metrics.test.ts
          src/lib/fix-agent-classification.ts
          src/lib/fix-agent-issues
          src/lib/developer-snippet-placements.test.ts
          src/lib/manual-paste-fix.test.ts
          src/lib/fix-strategies
